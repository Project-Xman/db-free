[package]
name = "db-free"
version = "0.1.0"
description = "Lightweight native database workbench"
authors = ["Farzan"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "db_free_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["compat"] }
# --- vendor adapters: each crate below is imported in exactly one layer ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
mongodb = { version = "3", features = ["compat-3-3-0", "bson-3"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
scylla = { version = "1", features = ["rustls-023", "chrono-04"] }
neo4rs = "0.8"
rskafka = { version = "0.6", features = ["transport-tls"] }
duckdb = { version = "1.4", features = ["bundled"] }
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "zstd", "snappy"] }
oracle = "0.6"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
csv = "1"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
await_holding_lock = "deny"
