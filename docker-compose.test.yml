# SOT: test-database-stack, docker-compose-engines
#
# WHAT:  One container per database engine DB Free ships an adapter for, so the
#        live round-trip tests can run against real servers instead of mocks.
# WHY:   Unit tests prove request/response shaping; only a real server proves an
#        adapter connects, lists, pages and queries. Every bug found so far
#        (immudb's ports, InfluxDB's CSV dialect, Cassandra's broadcast address,
#        HBase's Accept headers) was invisible until something real answered.
# HOW:   ./scripts/test-all-dbs.sh              # start, wait, test, report
#        docker compose -f docker-compose.test.yml up -d <service>
# WHERE: scripts/test-all-dbs.sh (runner), scripts/live-tests.sh (single engine)
#
# Host ports are all in the 5xxxx range so nothing collides with a database you
# already run locally. Everything is throwaway: no volumes, `down` wipes it.
#
# There are deliberately no healthchecks: the images disagree about what is
# installed (typesense has no curl, immudb has no shell) and in-container probes
# time out when 30 engines share a laptop. scripts/test-all-dbs.sh waits on the
# published port from the host instead, which works the same for every image.

name: dbfree-test

services:
  # ---------------------------------------------------------------- relational
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dbfree
      POSTGRES_DB: dbfree
    ports: ["55432:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbfree
      MYSQL_DATABASE: dbfree
    ports: ["53306:3306"]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: dbfree
      MARIADB_DATABASE: dbfree
    ports: ["53307:3306"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DbFree!Passw0rd"
      MSSQL_PID: Developer
    ports: ["51433:1433"]

  # ---------------------------------------------------------------- document
  mongodb:
    image: mongo:7
    ports: ["57017:27017"]

  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: dbfree
    ports: ["55984:5984"]

  # ---------------------------------------------------------------- key-value
  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["56380:6379"]

  memcached:
    image: memcached:alpine
    ports: ["51211:11211"]

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["58000:8000"]

  # ---------------------------------------------------------------- wide-column
  cassandra:
    image: cassandra:5
    environment:
      CASSANDRA_NUM_TOKENS: "1"
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1024M
    ports: ["59042:9042"]

  hbase:
    image: harisekhon/hbase:latest
    ports: ["58080:8080", "58085:8085"]

  # ---------------------------------------------------------------- graph
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/dbfreepass
      NEO4J_server_memory_heap_max__size: 512M
    ports: ["57474:7474", "57687:7687"]

  # ---------------------------------------------------------------- time-series
  influxdb:
    image: influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: dbfreepass
      DOCKER_INFLUXDB_INIT_ORG: dbfree
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dbfreetoken
    ports: ["58086:8086"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["59090:9090"]

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-selfScrapeInterval=5s"]
    ports: ["58428:8428"]

  # ---------------------------------------------------------------- vector
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["56333:6333"]

  chroma:
    image: chromadb/chroma:latest
    ports: ["58001:8000"]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.2
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /tmp/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports: ["58081:8080"]

  # Milvus needs etcd + object storage; `milvus-standalone` bundles them.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      ["etcd", "-advertise-client-urls=http://127.0.0.1:2379", "-listen-client-urls=http://0.0.0.0:2379",
       "--data-dir=/etcd"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports: ["59530:19530", "59091:9091"]
    depends_on: [milvus-etcd, milvus-minio]

  # ---------------------------------------------------------------- search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["59200:9200"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["59201:9200"]

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: dbfreekey
      MEILI_ENV: development
    ports: ["57700:7700"]

  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/tmp", "--api-key=dbfreekey", "--enable-cors"]
    ports: ["58108:8108"]

  # ---------------------------------------------------------------- multi-model
  arangodb:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: dbfree
    ports: ["58529:8529"]

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: ["start", "--user", "root", "--pass", "dbfree", "--bind", "0.0.0.0:8000"]
    ports: ["58002:8000"]

  orientdb:
    image: orientdb:latest
    environment:
      ORIENTDB_ROOT_PASSWORD: dbfree
    ports: ["52480:2480"]

  # ---------------------------------------------------------------- OLAP
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dbfree
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["58123:8123"]

  # Druid has no single-container mode: a query needs ZooKeeper, a metadata
  # store, the coordinator/overlord, a broker, a historical and the router.
  # `standalone-realtime` was removed years ago — it made the container exit at
  # once, which is why this engine only ever reported "never became ready".
  # The image is published for amd64 only, so on Apple Silicon every one of
  # these runs under emulation and the stack needs a lot of RAM.
  druid-zk:
    image: zookeeper:3.8
    profiles: ["heavy"]
  druid-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    profiles: ["heavy"]
  druid-coordinator:
    image: apache/druid:31.0.1
    platform: linux/amd64
    command: ["coordinator"]
    depends_on: [druid-zk, druid-db]
    env_file: [druid.env]
    profiles: ["heavy"]
  druid-broker:
    image: apache/druid:31.0.1
    platform: linux/amd64
    command: ["broker"]
    depends_on: [druid-coordinator]
    env_file: [druid.env]
    profiles: ["heavy"]
  druid-historical:
    image: apache/druid:31.0.1
    platform: linux/amd64
    command: ["historical"]
    depends_on: [druid-coordinator]
    env_file: [druid.env]
    profiles: ["heavy"]
  druid:
    image: apache/druid:31.0.1
    platform: linux/amd64
    command: ["router"]
    depends_on: [druid-broker, druid-historical]
    env_file: [druid.env]
    ports: ["58888:8888"]
    profiles: ["heavy"]

  # SpacetimeDB serves no tables until a module is published, and a module is a
  # Rust crate compiled to WASM — minutes of build, so this sits behind `heavy`.
  # `spacetimedb-seed` writes a two-column module and publishes it as
  # `quickstart`, which is what the live test reads.
  spacetimedb:
    image: clockworklabs/spacetime:latest
    command: ["start", "--listen-addr", "0.0.0.0:3000"]
    ports: ["53100:3000"]
    profiles: ["heavy"]
  spacetimedb-seed:
    image: clockworklabs/spacetime:latest
    depends_on: [spacetimedb]
    profiles: ["heavy"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export PATH=/usr/local/cargo/bin:$$PATH
        mkdir -p /tmp/mod/src
        cat > /tmp/mod/Cargo.toml <<'TOML'
        [package]
        name = "mymod"
        version = "0.1.0"
        edition = "2021"
        [lib]
        crate-type = ["cdylib"]
        [dependencies]
        spacetimedb = "2.10"
        TOML
        cat > /tmp/mod/src/lib.rs <<'RS'
        use spacetimedb::{reducer, table, ReducerContext, Table};
        #[table(accessor = person, public)]
        pub struct Person { #[primary_key] #[auto_inc] id: u64, name: String, age: u32 }
        #[reducer]
        pub fn add(ctx: &ReducerContext, name: String, age: u32) {
            ctx.db.person().insert(Person { id: 0, name, age });
        }
        RS
        until spacetime server add --url http://spacetimedb:3000 test -y 2>/dev/null; do sleep 2; done
        rustup target add wasm32-unknown-unknown
        spacetime publish -p /tmp/mod --server test -y quickstart
        spacetime call --server test quickstart add ann 31 || true
        spacetime call --server test quickstart add bob 45 || true

  # ---------------------------------------------------------------- object
  # MinIO speaks the S3 REST API, so it exercises the SigV4 signing path for
  # real. `minio-seed` creates a bucket with a couple of keys so the listing,
  # the prefix push-down and the object columns all have something to return.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["59000:9000"]
  minio-seed:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set t http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing t/dbfree;
      echo hello | mc pipe t/dbfree/logs/2026/app.log;
      echo world | mc pipe t/dbfree/logs/2026/error.log;
      echo other | mc pipe t/dbfree/reports/q1.csv;
      "

  # ---------------------------------------------------------------- ledger
  immudb:
    image: codenotary/immudb:latest
    ports: ["53322:3322", "58082:8080"]

  # ---------------------------------------------------------------- streaming
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:59092
    ports: ["59092:9092"]

  # ---------------------------------------------------------------- XML
  existdb:
    image: existdb/existdb:latest
    ports: ["58083:8080"]

  # ---------------------------------------------------------------- RDF
  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: dbfree
      FUSEKI_DATASET_1: ds
    ports: ["53030:3030"]

  # ---------------------------------------------------------------- relational (heavy)
  # Oracle is ~2 GB and slow to initialise; opt in with `--profile heavy`.
  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: dbfree
    ports: ["51521:1521"]
    profiles: ["heavy"]
