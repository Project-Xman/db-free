# SOT: release-pipeline, cross-platform-bundles, ci-cd
# WHAT:  Runs code checks (guardrail, tsc, eslint, clippy, cargo test) on PRs/pushes,
#        then on every green commit to main bumps the version, tags it, and
#        publishes installers for macOS (universal: arm64 + x86_64), Linux
#        (x86_64 and aarch64) and Windows (x64 and arm64) to a GitHub release,
#        together with the signed latest.json the in-app updater reads.
# WHY:   Guarantees continuous integration quality, provides downloadable main/nightly
#        installers, and automates cross-platform release delivery (PRD §6).
# HOW:   Fast Ubuntu check job gates a version job, which derives the next semver
#        from the Conventional Commit subjects since the last tag and pushes both
#        the bump commit and the tag; the matrix then builds that tag. Tags pushed
#        with GITHUB_TOKEN do not start another run (GitHub blocks the recursion),
#        which is why the build reads the tag from the version job rather than
#        waiting to be triggered by it. Every architecture builds on a
#        native runner rather than cross-compiling: webkit2gtk and the bundled C
#        dependencies (librocksdb-sys via bindgen, aws-lc-sys via cmake) are painful
#        to cross-build, and GitHub now publishes arm64 runners for Linux and Windows.
#        Every platform exports LIBCLANG_PATH here rather than in src-tauri/.cargo/
#        config.toml: a cargo [env] entry is host-agnostic and would point Linux at
#        a macOS path. libclang must match the runner's architecture, so the arm64
#        Windows runner installs LLVM's woa64 build instead of the x86-64 one.
#        macOS stays a single universal bundle because one .dmg then runs on both
#        Apple Silicon and Intel — two separate mac bundles would be strictly worse
#        for users and double the mac build time.
# WHERE: src-tauri/tauri.conf.json (bundle targets), scripts/test-all-dbs.sh (engines)
name: CI/CD
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      # libclang: librocksdb-sys runs bindgen at build time. cmake: aws-lc-sys (scylla TLS).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libclang-dev clang cmake
          lib=$(ls /usr/lib/llvm-*/lib/libclang.so* /usr/lib/*/libclang*.so* 2>/dev/null | head -n1)
          test -n "$lib" || { echo "libclang not found after install"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  version:
    name: Version & tag
    needs: check
    # Skips the bump commit itself, so the job cannot chase its own tail.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          next=$(bash scripts/next-version.sh)
          # A tag already on the remote means that version shipped (or a run died
          # after tagging), so walk the patch until the name is free.
          while git ls-remote --exit-code --tags origin "refs/tags/v$next" >/dev/null 2>&1; do
            next=$(python3 -c "import sys; p=sys.argv[1].split('.'); p[2]=str(int(p[2])+1); print('.'.join(p))" "$next")
          done
          bash scripts/set-version.sh "$next"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # Re-running after a failed build finds the files already bumped.
          git diff --cached --quiet || git commit -m "chore(release): v$next"
          # Annotated, and pushed by name: `--follow-tags` ignores lightweight
          # tags, which is how v0.2.0 was created and then never left the runner.
          git tag -a "v$next" -m "DB Free v$next"
          git push origin HEAD:main
          git push origin "refs/tags/v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build (${{ matrix.artifact-name }})
    needs: [check, version]
    # `version` is skipped for tag pushes and manual runs; the build still runs.
    if: always() && needs.check.result == 'success' && needs.version.result != 'failure' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal covers arm64 and x86_64 in one bundle.
          - platform: macos-latest
            family: macos
            artifact-name: macos-universal
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            family: linux
            artifact-name: linux-x86_64
            args: ""
          - platform: ubuntu-22.04-arm
            family: linux
            artifact-name: linux-aarch64
            args: ""
          - platform: windows-latest
            family: windows
            artifact-name: windows-x64
            args: ""
          - platform: windows-11-arm
            family: windows
            artifact-name: windows-arm64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # The bump commit is what carries the new version, so build the tag rather
      # than the commit that triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.family == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - if: matrix.family == 'linux'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libclang-dev clang cmake
          lib=$(ls /usr/lib/llvm-*/lib/libclang.so* /usr/lib/*/libclang*.so* 2>/dev/null | head -n1)
          test -n "$lib" || { echo "libclang not found after install"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"
      # windows-x64: chocolatey's llvm is x86-64 and matches the runner.
      - if: matrix.artifact-name == 'windows-x64'
        run: choco install -y llvm cmake --installargs 'ADD_CMAKE_TO_PATH=System'
      # windows-arm64: chocolatey ships only the x86-64 libclang.dll, which bindgen
      # rejects ("invalid DLL (x86-64)") because the build script itself is arm64.
      # LLVM publishes a native Windows-on-ARM build; cmake stays on chocolatey.
      - if: matrix.artifact-name == 'windows-arm64'
        shell: pwsh
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          $version = '20.1.8'
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-woa64.exe'
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-woa64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) { throw 'arm64 libclang.dll missing after install' }
      - if: matrix.family == 'macos'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - if: matrix.family == 'windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $env:GITHUB_ENV

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per architecture: the same OS builds two different targets.
          key: ${{ matrix.artifact-name }}
      - run: pnpm install --frozen-lockfile

      # The tag comes from the version job on main, or from the ref on a tag push.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "name=${{ needs.version.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        if: steps.tag.outputs.name != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundles and latest.json; without these the updater refuses
          # every build, so a missing secret must fail the release, not skip it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "DB Free ${{ steps.tag.outputs.name }}"
          # Published straight away: the first matrix job to finish creates the
          # release, the rest attach their installers to it as they land.
          releaseDraft: false
          prerelease: false
          # latest.json: the feed src-tauri/tauri.conf.json points the updater at.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build desktop app (manual dispatch)
        if: steps.tag.outputs.name == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-free-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
