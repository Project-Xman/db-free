# SOT: release-pipeline, cross-platform-bundles, ci-cd
# WHAT:  Runs code checks (guardrail, tsc, eslint, clippy, cargo test) on PRs/pushes,
#        builds installers for macOS (universal: arm64 + x86_64), Linux (x86_64 and
#        aarch64) and Windows (x64 and arm64) on every commit to main (uploaded as
#        artifacts), and attaches installers to a draft GitHub release on tags (v*).
# WHY:   Guarantees continuous integration quality, provides downloadable main/nightly
#        installers, and automates cross-platform release delivery (PRD §6).
# HOW:   Fast Ubuntu check job gates a matrix build. Every architecture builds on a
#        native runner rather than cross-compiling: webkit2gtk and the bundled C
#        dependencies (librocksdb-sys via bindgen, aws-lc-sys via cmake) are painful
#        to cross-build, and GitHub now publishes arm64 runners for Linux and Windows.
#        macOS stays a single universal bundle because one .dmg then runs on both
#        Apple Silicon and Intel — two separate mac bundles would be strictly worse
#        for users and double the mac build time.
# WHERE: src-tauri/tauri.conf.json (bundle targets), scripts/test-all-dbs.sh (engines)
name: CI/CD
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      # libclang: librocksdb-sys runs bindgen at build time. cmake: aws-lc-sys (scylla TLS).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libclang-dev clang cmake
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  bundle:
    name: Build (${{ matrix.artifact-name }})
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal covers arm64 and x86_64 in one bundle.
          - platform: macos-latest
            family: macos
            artifact-name: macos-universal
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            family: linux
            artifact-name: linux-x86_64
            args: ""
          - platform: ubuntu-22.04-arm
            family: linux
            artifact-name: linux-aarch64
            args: ""
          - platform: windows-latest
            family: windows
            artifact-name: windows-x64
            args: ""
          - platform: windows-11-arm
            family: windows
            artifact-name: windows-arm64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.family == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - if: matrix.family == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libclang-dev clang cmake
      - if: matrix.family == 'windows'
        run: choco install -y llvm cmake --installargs 'ADD_CMAKE_TO_PATH=System'
      - if: matrix.family == 'macos'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - if: matrix.family == 'windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $env:GITHUB_ENV

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per architecture: the same OS builds two different targets.
          key: ${{ matrix.artifact-name }}
      - run: pnpm install --frozen-lockfile

      - name: Build and draft release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DB Free ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build desktop app (main branch or manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-free-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
